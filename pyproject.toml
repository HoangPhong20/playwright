[tool.ruff]
target-version = "py310"
extend-exclude = [
    "data",
    "debug",
    "airflow/logs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["agoda_crawler"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
